    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let width;
        let height;

        function resize() {
            width = canvas.width = window.innerWidth * devicePixelRatio;
            height = canvas.height = window.innerHeight * devicePixelRatio;

            ctx.scale(devicePixelRatio, devicePixelRatio);

            width = window.innerWidth;
            height = window.innerHeight;
        }

        window.addEventListener("resize", resize);
        resize();


        /*
         * Lorenz system
         *
         * x' = sigma(y-x)
         * y' = x(rho-z)-y
         * z' = xy-beta z
         */

        const sigma = 10;
        const rho = 28;
        const beta = 8 / 3;

        let x = 0.1;
        let y = 0;
        let z = 0;

        const points = [];

        const maxPoints = 4200;


        function step(dt) {

            const dx = sigma * (y - x);
            const dy = x * (rho - z) - y;
            const dz = x * y - beta * z;

            x += dx * dt;
            y += dy * dt;
            z += dz * dt;

            points.push({
                x: x,
                y: y,
                z: z
            });

            if (points.length > maxPoints) {
                points.shift();
            }
        }


        function draw() {

            ctx.clearRect(0, 0, width, height);

            /*
             * Slowly rotate the attractor.
             */

            const angle = performance.now() * 0.00008;

            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);

            ctx.beginPath();

            for (let i = 0; i < points.length; i++) {

                const p = points[i];

                const rx =
                    p.x * cosA -
                    p.z * sinA;

                const rz =
                    p.x * sinA +
                    p.z * cosA;

                const scale =
                    Math.min(width, height) / 95;

                const px =
                    width / 2 +
                    rx * scale;

                const py =
                    height / 2 -
                    p.y * scale * 0.55;

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    ctx.lineTo(px, py);
                }
            }

            ctx.strokeStyle = "#111";
            ctx.lineWidth = 0.65;
            ctx.stroke();
        }


        function animate() {

            /*
             * Several integration steps per frame
             * keep the attractor smooth.
             */

            for (let i = 0; i < 8; i++) {
                step(0.005);
            }

            draw();

            requestAnimationFrame(animate);
        }

        animate();

    </script>
