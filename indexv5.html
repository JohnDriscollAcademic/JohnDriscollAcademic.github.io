<div class="equation">

    &nbsp;&nbsp;&nbsp;
    ẏ = x(ρ − z) − y
    &nbsp;&nbsp;&nbsp;

</div>

<script>


/* ============================================================
   CANVAS
   ============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let width;
let height;
let dpr;


function resize() {

    dpr =
        window.devicePixelRatio || 1;

    const rect =
        canvas.getBoundingClientRect();

    width =
        rect.width;

    height =
        rect.height;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* ============================================================
   PARAMETERS
   ============================================================ */

let sigma = 10;
let rho = 28;
let beta = 8 / 3;


const sigmaInput =
    document.getElementById("sigma");

const rhoInput =
    document.getElementById("rho");

const betaInput =
    document.getElementById("beta");


function updateParameters() {

    const s =
        parseFloat(sigmaInput.value);

    const r =
        parseFloat(rhoInput.value);

    const b =
        parseFloat(betaInput.value);


    if (
        Number.isFinite(s) &&
        Number.isFinite(r) &&
        Number.isFinite(b)
    ) {

        sigma = s;
        rho = r;
        beta = b;

        points.length = 0;

        x = 0.1;
        y = 0;
        z = 0;
    }
}


sigmaInput.addEventListener(
    "input",
    updateParameters
);

rhoInput.addEventListener(
    "input",
    updateParameters
);

betaInput.addEventListener(
    "input",
    updateParameters
);


/* ============================================================
   LORENZ STATE
   ============================================================ */

let x = 0.1;
let y = 0;
let z = 0;

const points = [];

const maxPoints = 4200;


/* ============================================================
   LORENZ EQUATIONS
   ============================================================ */

function lorenz(x, y, z) {

    return {

        x:
            sigma * (y - x),

        y:
            x * (rho - z) - y,

        z:
            x * y - beta * z
    };
}


/* ============================================================
   RK4 INTEGRATION
   ============================================================ */

function step(dt) {

    const k1 =
        lorenz(x, y, z);

    const k2 =
        lorenz(
            x + 0.5 * dt * k1.x,
            y + 0.5 * dt * k1.y,
            z + 0.5 * dt * k1.z
        );

    const k3 =
        lorenz(
            x + 0.5 * dt * k2.x,
            y + 0.5 * dt * k2.y,
            z + 0.5 * dt * k2.z
        );

    const k4 =
        lorenz(
            x + dt * k3.x,
            y + dt * k3.y,
            z + dt * k3.z
        );


    x +=
        dt / 6 *
        (
            k1.x +
            2 * k2.x +
            2 * k3.x +
            k4.x
        );

    y +=
        dt / 6 *
        (
            k1.y +
            2 * k2.y +
            2 * k3.y +
            k4.y
        );

    z +=
        dt / 6 *
        (
            k1.z +
            2 * k2.z +
            2 * k3.z +
            k4.z
        );


    points.push({
        x,
        y,
        z
    });


    if (
        points.length >
        maxPoints
    ) {
        points.shift();
    }
}


/* ============================================================
   DRAW
   ============================================================ */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const angle =
        performance.now() *
        0.000045;


    const cosA =
        Math.cos(angle);

    const sinA =
        Math.sin(angle);


    const scale =
        Math.min(
            width,
            height
        ) / 47;


    ctx.beginPath();


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const p =
            points[i];


        const rx =
            p.x * cosA -
            p.z * sinA;


        const rz =
            p.x * sinA +
            p.z * cosA;


        const perspective =
            1 /
            (
                1 +
                rz * 0.002
            );


        const px =
            width / 2 +
            rx *
            scale *
            perspective;


        const py =
            height / 2 -
            p.y *
            scale *
            0.60 *
            perspective;


        if (i === 0) {

            ctx.moveTo(
                px,
                py
            );

        } else {

            ctx.lineTo(
                px,
                py
            );
        }
    }


    ctx.strokeStyle =
        "#171713";

    ctx.lineWidth =
        0.55;

    ctx.stroke();
}


/* ============================================================
   ANIMATION
   ============================================================ */

function animate() {

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        step(0.006);
    }

    draw();

    requestAnimationFrame(
        animate
    );
}


animate();

</script>
