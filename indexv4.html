<script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let dpr;


    function resize() {

        dpr = window.devicePixelRatio || 1;

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }


    window.addEventListener("resize", resize);

    resize();


    /* ============================================================
       LORENZ SYSTEM

           x' = σ(y-x)
           y' = x(ρ-z)-y
           z' = xy-βz

       Classical chaotic parameter regime:

           σ = 10
           ρ = 28
           β = 8/3
       ============================================================ */

    const sigma = 10;
    const rho = 28;
    const beta = 8 / 3;


    let x = 0.1;
    let y = 0;
    let z = 0;


    const points = [];

    const maxPoints = 6500;


    /* ============================================================
       RK4 INTEGRATOR
       ============================================================ */

    function lorenz(x, y, z) {

        return {
            x: sigma * (y - x),
            y: x * (rho - z) - y,
            z: x * y - beta * z
        };

    }


    function step(dt) {

        const k1 = lorenz(x, y, z);

        const k2 = lorenz(
            x + 0.5 * dt * k1.x,
            y + 0.5 * dt * k1.y,
            z + 0.5 * dt * k1.z
        );

        const k3 = lorenz(
            x + 0.5 * dt * k2.x,
            y + 0.5 * dt * k2.y,
            z + 0.5 * dt * k2.z
        );

        const k4 = lorenz(
            x + dt * k3.x,
            y + dt * k3.y,
            z + dt * k3.z
        );


        x += dt / 6 *
            (k1.x + 2*k2.x + 2*k3.x + k4.x);

        y += dt / 6 *
            (k1.y + 2*k2.y + 2*k3.y + k4.y);

        z += dt / 6 *
            (k1.z + 2*k2.z + 2*k3.z + k4.z);


        points.push({
            x: x,
            y: y,
            z: z
        });


        if (points.length > maxPoints) {
            points.shift();
        }
    }


    /* ============================================================
       DRAW ATTRACTOR
       ============================================================ */

    function draw() {

        ctx.clearRect(0, 0, width, height);


        /*
         * Slowly rotate the three-dimensional attractor.
         */

        const angle =
            performance.now() * 0.000055;

        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);


        /*
         * Make the simulation large but leave enough space
         * for the paintings and name.
         */

        const scale =
            Math.min(width, height) / 48;


        ctx.beginPath();


        for (let i = 0; i < points.length; i++) {

            const p = points[i];


            const rx =
                p.x * cosA -
                p.z * sinA;


            const rz =
                p.x * sinA +
                p.z * cosA;


            /*
             * Slight perspective effect.
             */

            const perspective =
                1 / (1 + rz * 0.002);


            const px =
                width / 2 +
                rx * scale * perspective;


            const py =
                height / 2 -
                p.y * scale * 0.62 * perspective;


            if (i === 0) {

                ctx.moveTo(px, py);

            } else {

                ctx.lineTo(px, py);

            }
        }


        ctx.strokeStyle = "#171713";
        ctx.lineWidth = 0.55;

        ctx.stroke();
    }


    /* ============================================================
       ANIMATION
       ============================================================ */

    function animate() {

        /*
         * Integrate several small RK4 steps per frame.
         */

        for (let i = 0; i < 6; i++) {
            step(0.006);
        }

        draw();

        requestAnimationFrame(animate);
    }


    animate();

</script>
