<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>John Driscoll</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #f4f0e6;
            color: #171714;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* ============================================================
           NAME
        ============================================================ */

        .name {
            position: fixed;

            top: 35px;
            left: 45px;

            z-index: 10;

            width: min(390px, 42vw);

            mix-blend-mode: multiply;
        }

        .name img {
            display: block;

            width: 100%;
            height: auto;
        }


        /* ============================================================
           SIMULATION
        ============================================================ */

        #simulation {
            position: fixed;

            left: 50%;
            top: 47%;

            transform: translate(-50%, -50%);

            width: min(690px, 65vw);
            height: min(450px, 52vh);

            z-index: 1;

            border: 0.6px solid rgba(23,23,20,0.22);
        }

        #canvas {
            display: block;

            width: 100%;
            height: 100%;
        }


        /* ============================================================
           CONTROLS
        ============================================================ */

        .info {
            position: fixed;

            right: 45px;
            top: 50%;

            transform: translateY(-50%);

            width: 155px;

            z-index: 10;

            font-family: Arial, Helvetica, sans-serif;

            color: rgba(23,23,20,0.55);
        }


        .equation {
            margin-bottom: 18px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 15px;

            letter-spacing: 0.01em;

            color: rgba(23,23,20,0.62);
        }


        .description {
            margin-bottom: 24px;

            font-size: 9px;

            line-height: 1.6;

            letter-spacing: 0.04em;

            color: rgba(23,23,20,0.45);
        }


        .controls {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .control {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .control label {
            font-size: 9px;

            letter-spacing: 0.12em;

            text-transform: uppercase;
        }


        input {
            width: 55px;

            border: none;

            border-bottom: 1px solid rgba(23,23,20,0.30);

            background: transparent;

            outline: none;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 10px;

            color: #171714;

            padding: 3px 0;

            text-align: right;
        }


        /* Remove number input arrows */

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }


        /* ============================================================
           NAVIGATION
        ============================================================ */

        nav {
            position: fixed;

            bottom: 35px;
            right: 45px;

            z-index: 10;

            display: flex;

            gap: 20px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 9px;

            letter-spacing: 0.13em;

            text-transform: uppercase;
        }

        nav a {
            color: rgba(23,23,20,0.65);

            text-decoration: none;
        }

        nav a:hover {
            opacity: 0.4;
        }


        /* ============================================================
           MOBILE
        ============================================================ */

        @media (max-width: 900px) {

            .info {
                right: 25px;
                width: 130px;
            }

            #simulation {
                width: 70vw;
            }
        }


        @media (max-width: 700px) {

            .name {
                top: 25px;
                left: 25px;

                width: 260px;
            }

            #simulation {
                width: 88vw;
                height: 50vh;

                top: 46%;
            }

            .info {
                top: auto;
                bottom: 70px;

                right: 25px;

                width: 135px;

                transform: none;
            }

            .equation {
                font-size: 13px;
                margin-bottom: 10px;
            }

            .description {
                display: none;
            }

            nav {
                bottom: 25px;
                right: 25px;
            }
        }

    </style>
</head>


<body>


    <!-- ============================================================
         NAME
    ============================================================ -->

    <div class="name">

        <img
            src="JOHN_DRISCOLL_eigenfunctions_lmr.png"
            alt="John Driscoll"
        >

    </div>


    <!-- ============================================================
         BROWNIAN MOTION
    ============================================================ -->

    <div id="simulation">

        <canvas id="canvas"></canvas>

    </div>


    <!-- ============================================================
         EQUATION / DESCRIPTION / CONTROLS
    ============================================================ -->

    <div class="info">


        <div class="equation">

            dX<sub>t</sub> = √(2D) dW<sub>t</sub>

        </div>


        <div class="description">

            Brownian motion describes the
            random motion of particles
            undergoing continuous thermal
            fluctuations.

        </div>


        <div class="controls">


            <div class="control">

                <label for="diffusion">
                    D
                </label>

                <input
                    id="diffusion"
                    type="number"
                    value="1.0"
                    min="0.01"
                    max="10"
                    step="0.1"
                >

            </div>


            <div class="control">

                <label for="particles">
                    N
                </label>

                <input
                    id="particles"
                    type="number"
                    value="160"
                    min="10"
                    max="500"
                    step="10"
                >

            </div>


        </div>

    </div>


    <!-- ============================================================
         NAVIGATION
    ============================================================ -->

    <nav>

        <a href="research.html">
            Research
        </a>

        <a href="cv.html">
            CV
        </a>

    </nav>


    <script>


        /* ============================================================
           CANVAS
        ============================================================ */

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const simulation =
            document.getElementById("simulation");


        const diffusionInput =
            document.getElementById("diffusion");

        const particlesInput =
            document.getElementById("particles");


        let width;
        let height;

        let particles = [];


        /* ============================================================
           RESIZE
        ============================================================ */

        function resize() {

            const dpr =
                window.devicePixelRatio || 1;

            width =
                simulation.clientWidth;

            height =
                simulation.clientHeight;


            canvas.width =
                width * dpr;

            canvas.height =
                height * dpr;


            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            /*
             * Keep particles inside the new domain.
             */

            for (const p of particles) {

                p.x = Math.min(
                    Math.max(p.x, 0),
                    width
                );

                p.y = Math.min(
                    Math.max(p.y, 0),
                    height
                );

            }

        }


        window.addEventListener(
            "resize",
            resize
        );

        resize();


        /* ============================================================
           GAUSSIAN RANDOM VARIABLE
           
           Box-Muller transform.
        ============================================================ */

        function gaussian() {

            let u = 0;
            let v = 0;


            while (u === 0) {
                u = Math.random();
            }

            while (v === 0) {
                v = Math.random();
            }


            return Math.sqrt(
                -2 * Math.log(u)
            ) *
            Math.cos(
                2 * Math.PI * v
            );

        }


        /* ============================================================
           CREATE PARTICLES
        ============================================================ */

        function createParticles() {

            const N =
                parseInt(
                    particlesInput.value
                ) || 160;


            particles = [];


            for (let i = 0; i < N; i++) {

                particles.push({

                    x: width / 2,
                    y: height / 2,

                    history: [],

                    /*
                     * Used to detect wrapping.
                     */

                    wrapped: false

                });

            }

        }


        createParticles();


        /* ============================================================
           BROWNIAN MOTION
           
           dX = sqrt(2D) dW
        ============================================================ */

        function step() {

            const D =
                parseFloat(
                    diffusionInput.value
                ) || 1;


            const dt = 0.7;


            const sigma =
                Math.sqrt(
                    2 * D * dt
                );


            for (const p of particles) {

                const oldX = p.x;
                const oldY = p.y;


                p.x +=
                    sigma * gaussian();

                p.y +=
                    sigma * gaussian();


                p.wrapped = false;


                /*
                 * Periodic boundary conditions.
                 *
                 * Mark particles that crossed the
                 * boundary so their trajectory isn't
                 * drawn across the entire box.
                 */

                if (p.x < 0) {

                    p.x = width;

                    p.wrapped = true;

                }


                if (p.x > width) {

                    p.x = 0;

                    p.wrapped = true;

                }


                if (p.y < 0) {

                    p.y = height;

                    p.wrapped = true;

                }


                if (p.y > height) {

                    p.y = 0;

                    p.wrapped = true;

                }


                /*
                 * Store trajectory point.
                 */

                p.history.push({

                    x: p.x,
                    y: p.y,
                    wrapped: p.wrapped

                });


                /*
                 * Keep trajectories short.
                 */

                if (p.history.length > 100) {

                    p.history.shift();

                }

            }

        }


        /* ============================================================
           DRAW
        ============================================================ */

        function draw() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /* --------------------------------------------------------
               Tiny coordinate axes
            -------------------------------------------------------- */

            ctx.beginPath();


            ctx.moveTo(
                width / 2 - 22,
                height / 2
            );

            ctx.lineTo(
                width / 2 + 22,
                height / 2
            );


            ctx.moveTo(
                width / 2,
                height / 2 - 22
            );

            ctx.lineTo(
                width / 2,
                height / 2 + 22
            );


            ctx.strokeStyle =
                "rgba(23,23,20,0.13)";

            ctx.lineWidth = 0.5;

            ctx.stroke();


            /* --------------------------------------------------------
               Particle trajectories
            -------------------------------------------------------- */

            for (const p of particles) {


                if (p.history.length < 2)
                    continue;


                ctx.beginPath();


                let previous =
                    p.history[0];


                ctx.moveTo(
                    previous.x,
                    previous.y
                );


                for (
                    let i = 1;
                    i < p.history.length;
                    i++
                ) {

                    const q =
                        p.history[i];


                    /*
                     * Don't connect points when
                     * a particle wrapped around
                     * the simulation boundary.
                     */

                    if (q.wrapped) {

                        ctx.strokeStyle =
                            "rgba(23,23,20,0.065)";

                        ctx.lineWidth = 0.45;

                        ctx.stroke();


                        ctx.beginPath();

                        ctx.moveTo(
                            q.x,
                            q.y
                        );

                    } else {

                        ctx.lineTo(
                            q.x,
                            q.y
                        );

                    }


                    previous = q;

                }


                ctx.strokeStyle =
                    "rgba(23,23,20,0.065)";

                ctx.lineWidth = 0.45;

                ctx.stroke();


                /* ----------------------------------------------------
                   Current particle
                ---------------------------------------------------- */

                const last =
                    p.history[
                        p.history.length - 1
                    ];


                ctx.beginPath();


                ctx.arc(
                    last.x,
                    last.y,
                    1.65,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    "rgba(23,23,20,0.38)";


                ctx.fill();

            }

        }


        /* ============================================================
           ANIMATION
        ============================================================ */

        function animate() {

            /*
             * Multiple small integration steps
             * per animation frame.
             */

            for (let i = 0; i < 3; i++) {

                step();

            }


            draw();


            requestAnimationFrame(
                animate
            );

        }


        animate();


        /* ============================================================
           PARAMETERS
        ============================================================ */

        particlesInput.addEventListener(
            "change",
            createParticles
        );


        /*
         * Allow pressing Enter after changing
         * the particle count.
         */

        particlesInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    createParticles();

                    particlesInput.blur();

                }

            }
        );


    </script>

</body>
</html>
