<style>

    z-index: 4;

}


/* ============================================================
   PARAMETERS
   ============================================================ */

.controls {
    position: fixed;

    left: 50%;
    bottom: 53px;

    transform: translateX(-50%);

    z-index: 10;

    display: flex;
    gap: 18px;

    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 9px;

    color: rgba(23, 23, 19, 0.42);

    pointer-events: auto;
}

.controls label {
    display: flex;
    align-items: center;
    gap: 4px;
}

.controls input {
    width: 42px;

    border: 0;

    border-bottom:
        1px solid rgba(23, 23, 19, 0.20);

    border-radius: 0;

    padding: 1px 0;

    background: transparent;

    outline: none;

    color: rgba(23, 23, 19, 0.65);

    font-family: Arial, Helvetica, sans-serif;

    font-size: 9px;

    text-align: center;

    appearance: textfield;

    -moz-appearance: textfield;
}

.controls input::-webkit-inner-spin-button,
.controls input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

.controls input:focus {
    border-bottom-color:

/* ============================================================
   NAVIGATION
   ============================================================ */

        bottom: 47px;

     ============================================================ -->

```
<canvas id="canvas"></canvas>
```

<!-- ============================================================
     GRAY-SCOTT EQUATIONS
     ============================================================ -->

<div class="equation">

```
∂u/∂t = Dᵤ∇²u − uv² + F(1 − u)
&nbsp;&nbsp;&nbsp;
∂v/∂t = Dᵥ∇²v + uv² − (F + k)v
```

</div>

<!-- ============================================================
     PARAMETERS
     ============================================================ -->

<div class="controls">

```
<label>
    F
    <input
        id="feed"
        type="number"
        value="0.055"
        step="0.001"
    >
</label>

<label>
    k
    <input
        id="kill"
        type="number"
        value="0.062"
        step="0.001"
    >
</label>

<label>
    Dᵤ
    <input
        id="du"
        type="number"
        value="0.16"
        step="0.01"
    >
</label>

<label>
    Dᵥ
    <input
        id="dv"
        type="number"
        value="0.08"
        step="0.01"
    >
</label>
```

<script>


/* ============================================================
   CANVAS
   ============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const simWidth = 260;
const simHeight = 210;

canvas.width = simWidth;
canvas.height = simHeight;


/* ============================================================
   PARAMETERS
   ============================================================ */

let F = 0.055;
let k = 0.062;

let Du = 0.16;
let Dv = 0.08;


const feedInput =
    document.getElementById("feed");

const killInput =
    document.getElementById("kill");

const duInput =
    document.getElementById("du");

const dvInput =
    document.getElementById("dv");


/* ============================================================
   STATE
   ============================================================ */

let u;
let v;


function createSystem() {

    u =
        new Float32Array(
            simWidth * simHeight
        );

    v =
        new Float32Array(
            simWidth * simHeight
        );


    for (
        let i = 0;
        i < u.length;
        i++
    ) {

        u[i] = 1;
        v[i] = 0;
    }


    /*
     * Small central perturbations.
     */

    const cx =
        simWidth / 2;

    const cy =
        simHeight / 2;


    for (
        let y0 = cy - 14;
        y0 < cy + 14;
        y0++
    ) {

        for (
            let x0 = cx - 14;
            x0 < cx + 14;
            x0++
        ) {

            const dx =
                x0 - cx;

            const dy =
                y0 - cy;


            if (
                dx * dx +
                dy * dy <
                180
            ) {

                const index =
                    y0 * simWidth + x0;

                u[index] = 0.50;
                v[index] = 0.25;
            }
        }
    }

}


/* ============================================================
   PARAMETER UPDATE
   ============================================================ */

function updateParameters() {

    const newF =
        parseFloat(feedInput.value);

    const newK =
        parseFloat(killInput.value);

    const newDu =
        parseFloat(duInput.value);

    const newDv =
        parseFloat(dvInput.value);


    if (
        Number.isFinite(newF) &&
        Number.isFinite(newK) &&
        Number.isFinite(newDu) &&
        Number.isFinite(newDv)
    ) {

        F = newF;
        k = newK;

        Du = newDu;
        Dv = newDv;

        createSystem();
    }

}


feedInput.addEventListener(
    "input",
    updateParameters
);

killInput.addEventListener(
    "input",
    updateParameters
);

duInput.addEventListener(
    "input",
    updateParameters
);

dvInput.addEventListener(
    "input",
    updateParameters
);


createSystem();


/* ============================================================
   LAPLACIAN
   ============================================================ */

function laplacian(arr, x0, y0) {

    const xm =
        x0 === 0 ?
        simWidth - 1 :
        x0 - 1;

    const xp =
        x0 === simWidth - 1 ?
        0 :
        x0 + 1;

    const ym =
        y0 === 0 ?
        simHeight - 1 :
        y0 - 1;

    const yp =
        y0 === simHeight - 1 ?
        0 :
        y0 + 1;


    const center =
        arr[y0 * simWidth + x0];


    return (
        arr[y0 * simWidth + xm] +
        arr[y0 * simWidth + xp] +
        arr[ym * simWidth + x0] +
        arr[yp * simWidth + x0] -
        4 * center
    );

}


/* ============================================================
   SIMULATION STEP
   ============================================================ */

const nextU =
    new Float32Array(
        simWidth * simHeight
    );

const nextV =
    new Float32Array(
        simWidth * simHeight
    );


function simulate() {

    const dt = 1;


    for (
        let y0 = 0;
        y0 < simHeight;
        y0++
    ) {

        for (
            let x0 = 0;
            x0 < simWidth;
            x0++
        ) {

            const index =
                y0 * simWidth + x0;


            const U =
                u[index];

            const V =
                v[index];


            const reaction =
                U * V * V;


            const Lu =
                laplacian(
                    u,
                    x0,
                    y0
                );


            const Lv =
                laplacian(
                    v,
                    x0,
                    y0
                );


            nextU[index] =
                U +
                dt *
                (
                    Du * Lu -
                    reaction +
                    F * (1 - U)
                );


            nextV[index] =
                V +
                dt *
                (
                    Dv * Lv +
                    reaction -
                    (F + k) * V
                );

        }
    }


    const tempU = u;
    u = nextU;
    nextU.set(tempU);


    const tempV = v;
    v = nextV;
    nextV.set(tempV);

}


/* ============================================================
   RENDER
   ============================================================ */

const image =
    ctx.createImageData(
        simWidth,
        simHeight
    );


function draw() {

    for (
        let i = 0;
        i < v.length;
        i++
    ) {

        const value =
            Math.max(
                0,
                Math.min(
                    1,
                    v[i] * 2.8
                )
            );


        /*
         * Keep the pattern monochrome so it
         * remains quiet against the paintings.
         */

        const c =
            Math.floor(
                value * 255
            );


        image.data[i * 4] =
            c;

        image.data[i * 4 + 1] =
            c;

        image.data[i * 4 + 2] =
            c;

        image.data[i * 4 + 3] =
            255;
    }


    ctx.putImageData(
        image,
        0,
        0
    );
}


/* ============================================================
   ANIMATION
   ============================================================ */

function animate() {

    /*
     * Several numerical steps per frame.
     */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        simulate();
    }


    draw();

    requestAnimationFrame(
        animate
    );

}


animate();

</script>
